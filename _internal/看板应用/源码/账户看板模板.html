async function getKline(key,period='day',adjustment='raw'){
 const name=adjustment==='qfq'?period+'_qfq':period;
 if(klineCache.get(key)?.[name])return klineCache.get(key);if(!localMode)return klineCache.get(key)||null;
 const query=new URLSearchParams({symbol:key,period,adjustment});
 const r=await fetch('/api/kline?'+query,{headers:{'X-Dashboard-Token':localToken}});
 if(!r.ok)throw Error('kline');const value=await r.json();if(value.data)klineCache.set(key,value.data);return value.data;
}
async function activateDetail(p,i,zoom){

 try{
  const outer=p.key.split(':')[0],intraday=outer==='SH'||outer==='SZ'||outer==='BJ';
